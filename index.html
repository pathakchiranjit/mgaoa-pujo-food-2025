<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Booking Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form-container">
    <h1>Manjuri Garden Pujo Food Festival 2025</h1>
    <form id="foodForm">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="text" name="flat" placeholder="Flat No (e.g., 1-2A)" pattern="[1-5]-[1-4][A-D]" required />
      <input type="tel" name="phone" placeholder="Phone Number" pattern="\d{10}" required />
      <input type="number" name="attendees" placeholder="No. of Attendees" required min="1" />
      <button type="submit">Submit</button>
    </form>
    <p id="response"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
